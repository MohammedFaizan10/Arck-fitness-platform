kind = "web"
previewPath = "/"
title = "ArckFit Fitness Platform"
description = "A responsive fitness management website demo connecting gym members, trainers, and gym owners. Includes workout tracking, progress, nutrition, trainer discovery, a simulated AI coach, memberships, and gym administration using fictional local data and demo interactions."
version = "1.0.0"
id = "artifacts/arckfit-fitness"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22946

[services.development]
run = "pnpm --filter @workspace/arckfit-fitness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arckfit-fitness", "run", "build" ]
serve = "static"
publicDir = "artifacts/arckfit-fitness/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22946"
BASE_PATH = "/"
